server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:ecommerce}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_schema
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    default-schema: user_schema
    schemas: user_schema
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:${EUREKA_SERVER_PORT:8761}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:change-me-in-local-env-change-me-in-local-env-123456}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}

auth:
  refresh-token:
    expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}
    cookie-name: refreshToken

