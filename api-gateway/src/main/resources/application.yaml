server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service-auth
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service-me
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v1/users/**
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/v1/products/**
            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/v1/carts/**
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payments/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/
    registry-fetch-interval-seconds: 5

  instance:
    prefer-ip-address: true

frontend:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}
