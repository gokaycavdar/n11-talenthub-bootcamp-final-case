name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
      - "codex/**"
  pull_request:

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - cart-service
          - order-service
          - payment-service
          - notification-service

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ecommerce"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics check_port_connectivity"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10

      eureka:
        image: ecommerce/eureka-server:latest
        ports:
          - 8761:8761
        options: >-
          --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=20

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    env:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433

      REDIS_HOST: localhost
      REDIS_PORT: 6379

      RABBITMQ_HOST: localhost
      RABBITMQ_AMQP_PORT: 5672
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

      EUREKA_HOST: localhost
      EUREKA_SERVER_PORT: 8761

      JWT_SECRET: change-me-in-ci-change-me-in-ci-123456789
      JWT_EXPIRATION_MS: 900000
      REFRESH_TOKEN_EXPIRATION_MS: 604800000
      CART_TTL_SECONDS: 604800

      PAYMENT_PROVIDER: MOCK
      PAYMENT_CALLBACK_URL: http://localhost:8080/api/v1/payments/3ds/callback

      IYZICO_API_KEY: dummy
      IYZICO_SECRET_KEY: dummy
      IYZICO_BASE_URL: https://sandbox-api.iyzipay.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Eureka image for dependent tests
        if: matrix.service == 'order-service'
        working-directory: eureka-server
        run: ./mvnw -B -DskipTests jib:dockerBuild

      - name: Wait for infrastructure
        run: |
          echo "Infra services are provisioned by GitHub Actions services"

      - name: Run tests
        run: ./mvnw -B clean test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ecommerce-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ecommerce-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1
        run: npm run build
